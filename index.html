const INT=[],RC=new THREE.Raycaster();RC.far=4.2;let TG=null,BOOST=0,LON=true;
function aim(){RC.setFromCamera({x:0,y:0},CAM);const h=RC.intersectObjects(INT,true)[0];let o=h&&h.object;while(o&&!o.userData.act)o=o.parent;if(o)return o.userData.act;
const f=new THREE.Vector3();CAM.getWorldDirection(f);let best=null,bd=3.6;INT.forEach(m=>{const d=m.position.clone().sub(CAM.position),dist=Math.hypot(d.x,d.z);if(dist<bd&&dist>.01&&(d.x*f.x+d.z*f.z)/dist>.8){bd=dist;best=m.userData.act}});return best}
function hit(w,h,d,x,y,z,name,fn){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({visible:false}));m.position.set(x,y,z);m.userData.act={name,fn};SC.add(m);INT.push(m)}

box(.1,.35,.22,0xf8fafc,-11.8,1.5,-1);hit(.8,.8,.8,-11.5,1.5,-1,'Saklar Lampu',()=>{LON=!LON;SC.traverse(o=>{if(o.isPointLight&&o!==RL)o.visible=LON});toast(LON?'💡 Lampu menyala':'🌙 Lampu dimatikan')});
box(1.1,2.3,1.3,0xdc2626,-11.2,1.15,-6);box(.8,1.2,.05,0x111827,-10.6,1.4,-6);const vl=label('Mesin Soda');vl.position.set(-11.2,2.8,-6);SC.add(vl);
hit(1.6,2.5,1.8,-11,1.25,-6,'Mesin Soda $3',()=>{if(S.money>=3){S.money-=3;BOOST=clock.elapsedTime+25;toast('🥤 Segar! Lari lebih cepat 25 detik');ui();save()}else toast('Uang tidak cukup')});
const TALK=['Halo! Toko ini lengkap ya.','Aku mau rakit PC buat gaming!','RTX 4090 itu impian... 😍','Ada diskon hari ini?','Kerja bagus, Bos!'];
NPC.forEach((n,i)=>{n.g.userData.act={name:['Pak Andi','Bu Sinta','Mas Joko'][i]+' (ngobrol)',fn:()=>{const tip=Math.random()<.25;toast('💬 '+TALK[Math.random()*TALK.length|0]+(tip?' (+$5 tip)':''));if(tip){S.money+=5;ui();save()}}};INT.push(n.g)});

/* ===== PELANGGAN HIDUP ===== */
const angLerp=(a,b,k)=>a+Math.atan2(Math.sin(b-a),Math.cos(b-a))*Math.min(1,k);
function look(g,dt){talk(g,dt);const px=PL.position.x-g.position.x,pz=PL.position.z-g.position.z;let ty=0;if(Math.hypot(px,pz)<6&&!MENU){const q=Math.atan2(px,pz)-g.rotation.y;ty=clamp(Math.atan2(Math.sin(q),Math.cos(q)),-1.1,1.1)}g.H.rotation.y+=(ty-g.H.rotation.y)*Math.min(1,dt*6)}
function npcU(n,i,dt,t){const g=n.g,px=PL.position.x-g.position.x,pz=PL.position.z-g.position.z;
if(Math.hypot(px,pz)<2.6&&!MENU){g.rotation.y=angLerp(g.rotation.y,Math.atan2(px,pz),dt*4);swing(g,0,0)}
else{const dx=n.tx-g.position.x,dz=n.tz-g.position.z,d=Math.hypot(dx,dz);if(d<.4){n.tx=Math.random()*18-9;n.tz=Math.random()*18-9}else{g.position.x+=dx/d*2*dt;g.position.z+=dz/d*2*dt;g.rotation.y=angLerp(g.rotation.y,Math.atan2(dx,dz),dt*8);swing(g,t*7+i,1)}}
look(g,dt)}
const CUST=[],CC=[0xf59e0b,0x0ea5e9,0xec4899,0x84cc16,0x6366f1];let SP=1;
function serve(c){if(c.st=='out')return;if(c.slot==0&&c.w>1){const p=8+(Math.random()*18|0);S.money+=p;c.st='out';cashSnd();toast('🛒 Pelanggan dilayani +$'+p);ui();save()}else toast('Layani yang paling depan dulu ya')}
function spawnC(){const i=Math.random()*5|0,g=human(CC[i],[0xf1c9a0,0xd9a679,0x8d5a3b,0xe0b48a][i%4],{hair:[0x1a1a1a,0x6b3a1f,0xd6b46b,0x3a2a1a,0x7a7a7a][i],long:i%2==1,pants:[0x374151,0x1e293b,0x44403c,0x2f3e2f,0x3b2f4a][i],longSleeve:i%3==0}),c={g,st:'in',w:0,slot:9};g.position.set(8,0,10);SC.add(g);g.pf=i%2==1?210:115;g.traverse(o=>{if(o.isMesh)o.castShadow=true});g.userData.act={name:'Pelanggan',fn:()=>serve(c)};INT.push(g);CUST.push(c)}
function updC(dt,t){SP-=dt;if(SP<=0&&CUST.length<4){spawnC();SP=9+Math.random()*9}
CUST.filter(c=>c.st!='out').forEach((c,k)=>c.slot=k);
for(let i=CUST.length-1;i>=0;i--){const c=CUST[i],g=c.g,o=c.st=='out',tx=o?8:-8,tz=o?10.6:7.4+c.slot*1.1,dx=tx-g.position.x,dz=tz-g.position.z,d=Math.hypot(dx,dz);
if(d>.15){g.position.x+=dx/d*2*dt;g.position.z+=dz/d*2*dt;g.rotation.y=angLerp(g.rotation.y,Math.atan2(dx,dz),dt*8);swing(g,t*7+i,1)}
else{swing(g,0,0);if(o){SC.remove(g);INT.splice(INT.indexOf(g),1);CUST.splice(i,1);continue}g.rotation.y=angLerp(g.rotation.y,Math.PI,dt*6);c.w+=dt;if(c.w>40)c.st='out'}
g.userData.act.name=c.slot==0&&c.w>1&&!o?'Layani Pelanggan':'Pelanggan antre';look(g,dt)}}
INT.find(m=>m.userData.act&&m.userData.act.name=='Kasir').userData.act.fn=()=>{if(stj('kasir'))return;const c=CUST.find(c=>c.slot==0&&c.w>1&&c.st!='out');if(c)serve(c);else toast('Kasir: Belum ada pelanggan antre 🛍️')};
/* ===== AUDIO (sintesis, tanpa file) ===== */
let AC=null,MUS,SFX,NB,BG,BF,LSB=0,BP=0,stp=0,nt=0;
const CH=[[48,55,59,64],[45,52,57,60],[50,57,60,65],[43,50,55,59]],mf=n=>440*Math.pow(2,(n-69)/12),VW=[[800,1200],[500,1800],[300,2300],[500,900],[350,700]];
function vol(){if(!AC)return;MUS.gain.value=S.mus===0?0:.5;SFX.gain.value=S.snd===0?0:.9}
function note(t,f,d,v,type,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.04,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)}
function noiseHit(t,d,v,f,type,dest){const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;fl.type=type;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t,Math.random());s.stop(t+d+.02)}
function sched(){const E=60/72/2;while(nt<AC.currentTime+.25){const s=stp%32,ch=CH[s>>3],k=s&7,t=nt;
if(k==0){ch.forEach(n=>note(t,mf(n+12),E*7,.035,'triangle',MUS));note(t,mf(ch[0]-12),E*3.5,.22,'sine',MUS)}
if(k==4)note(t,mf(ch[0]-12),E*3,.16,'sine',MUS);
if(k==0||k==3){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(MUS);o.start(t);o.stop(t+.22)}
if(k==2||k==6)noiseHit(t,.14,.12,1800,'bandpass',MUS);if(k%2)noiseHit(t,.04,.05,7000,'highpass',MUS);
if(Math.random()<.4)note(t,mf([72,74,76,79,81,84][Math.random()*6|0]),E*2,.07,'triangle',MUS);nt+=E;stp++}}
function audioInit(){if(AC){if(AC.state=='suspended')AC.resume();return}
try{AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.connect(AC.destination);MUS=AC.createGain();MUS.connect(lp);SFX=AC.createGain();SFX.connect(AC.destination);
BF=AC.createBiquadFilter();BF.type='bandpass';BF.Q.value=.6;BG=AC.createGain();BG.gain.value=0;const bs=AC.createBufferSource();bs.buffer=NB;bs.loop=true;bs.connect(BF);BF.connect(BG);BG.connect(SFX);bs.start();
vol();nt=AC.currentTime+.1;setInterval(sched,60);AC.resume()}catch(e){AC=null}}
addEventListener('pointerdown',audioInit);addEventListener('keydown',audioInit);
function out(x,z){const dx=x-PL.position.x,dz=z-PL.position.z,d=Math.hypot(dx,dz);if(d>16)return null;const o=AC.createGain();o.gain.value=Math.min(1,1.6/(1+d*d*.12));
if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=clamp((dx*Math.cos(yaw)-dz*Math.sin(yaw))/Math.max(d,.5),-1,1);o.connect(p);p.connect(SFX)}else o.connect(SFX);return o}
function stepTick(mv,dt){if(!AC)return;const sb=Math.floor(bob/Math.PI);if(sb!=LSB){LSB=sb;if(mv){const t=AC.currentTime;noiseHit(t,.13,.5,420+Math.random()*120,'lowpass',SFX);noiseHit(t,.03,.1,3000,'highpass',SFX);note(t,70,.1,.3,'sine',SFX)}}
BP+=dt*Math.PI*2*(mv?.8:.28);const k=Math.sin(BP)*.5+.5;BG.gain.setTargetAtTime(Math.pow(k,1.5)*(mv?.3:.15),AC.currentTime,.05);BF.frequency.value=500+k*500}
function npcStep(h){const o=out(h.position.x,h.position.z);if(o)noiseHit(AC.currentTime,.1,.25,450,'lowpass',o)}
function cashSnd(){if(!AC)return;const t=AC.currentTime;note(t,1568,.5,.15,'sine',SFX);note(t+.08,2093,.7,.12,'sine',SFX)}
function speak(x,z,base,len){if(!AC)return;const o=out(x,z);if(!o)return;let t=AC.currentTime+.02;const n=len||(3+Math.random()*5|0);
for(let i=0;i<n;i++){const v=VW[Math.random()*5|0],d=.09+Math.random()*.08,f=base*(.92+Math.random()*.25),s=AC.createOscillator(),g=AC.createGain(),b1=AC.createBiquadFilter(),b2=AC.createBiquadFilter(),m2=AC.createGain();
s.type='sawtooth';s.frequency.setValueAtTime(f,t);s.frequency.linearRampToValueAtTime(f*(.9+Math.random()*.2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1.4,t+.02);g.gain.linearRampToValueAtTime(0,t+d);
b1.type=b2.type='bandpass';b1.frequency.value=v[0];b2.frequency.value=v[1];b1.Q.value=b2.Q.value=6;m2.gain.value=.5;s.connect(b1);s.connect(b2);b1.connect(g);b2.connect(m2);m2.connect(g);g.connect(o);s.start(t);s.stop(t+d+.02);t+=d+.03+Math.random()*.07}}
function talk(g,dt){g.tk=(g.tk===undefined?2+Math.random()*5:g.tk)-dt;if(g.tk<=0){g.tk=7+Math.random()*10;if(AC&&!MENU)speak(g.position.x,g.position.z,g.pf||130)}}
NPC.forEach((n,i)=>{n.g.pf=[110,205,125][i];const f=n.g.userData.act.fn;n.g.userData.act.fn=()=>{f();if(AC)speak(n.g.position.x,n.g.position.z,n.g.pf,6)}});
R.shadowMap.enabled=S.sh!==0;document.body.classList.add('m');menuR();update3D();ui();loop();
