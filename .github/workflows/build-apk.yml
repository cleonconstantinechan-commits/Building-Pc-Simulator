name: Building Pc Simulator
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Siapkan game
        run: |
          mkdir -p www
          cp index.html www/index.html
          curl -L -o www/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
      - name: Bangun APK
        run: |
          npm install
          npx cap add android
          npx cap sync android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$GITHUB_WORKSPACE/android/app/src/main/AndroidManifest.xml"
          ls -la "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"
          if [ ! -f gradlew ]; then gradle wrapper; fi
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Building-Pc-Simulator.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Building-Pc-Simulator
          path: Building-Pc-Simulator.apk
